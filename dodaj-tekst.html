const SUPABASE_ANON_KEY = "sb_publishable_IU3Bb6fXNt6mZlJGx3JHjA_Ff_Otitd";

const root = document.documentElement;
const toggle = document.getElementById("themeToggle");
function applyTheme(t) {
    root.dataset.theme = t;
    if (toggle) toggle.setAttribute("aria-pressed", t === "dark");
}
applyTheme(root.dataset.theme || "light");
if (toggle) {
    toggle.addEventListener("click", () => {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem("lyrio-theme", next); } catch (e) {}
    });
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const form = document.getElementById("submitSongForm");
const btn = document.getElementById("submitBtn");
const msg = document.getElementById("submitMsg");
const ytInput = document.getElementById("youtubeUrl");
const ytPreviewBox = document.getElementById("ytPreviewBox");
const ytPreviewFrame = document.getElementById("ytPreviewFrame");

function extractYouTubeId(rawUrl) {
    if (!rawUrl) return null;
    const trimmed = rawUrl.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;

    try {
        const url = new URL(trimmed);
        const host = url.hostname.replace(/^www\./, "");
        const allowedHosts = new Set([
            "youtube.com",
            "m.youtube.com",
            "music.youtube.com",
            "youtu.be",
            "youtube-nocookie.com"
        ]);
        if (!allowedHosts.has(host)) return null;

        if (host === "youtu.be") {
            const id = url.pathname.split("/").filter(Boolean)[0];
            return id && /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;
        }

        const vParam = url.searchParams.get("v");
        if (vParam && /^[a-zA-Z0-9_-]{11}$/.test(vParam)) return vParam;

        const parts = url.pathname.split("/").filter(Boolean);
        const embedIdx = parts.findIndex(p => p === "embed" || p === "shorts" || p === "live");
        if (embedIdx !== -1 && parts[embedIdx + 1] && /^[a-zA-Z0-9_-]{11}$/.test(parts[embedIdx + 1])) {
            return parts[embedIdx + 1];
        }
    } catch (e) {
        return null;
    }
    return null;
}

function updateYouTubePreview() {
    const vid = extractYouTubeId(ytInput.value);
    if (vid) {
        ytPreviewFrame.src = `https://www.youtube.com/embed/${encodeURIComponent(vid)}`;
        ytPreviewBox.style.display = "block";
    } else {
        ytPreviewFrame.removeAttribute("src");
        ytPreviewBox.style.display = "none";
    }
}

ytInput.addEventListener("input", updateYouTubePreview);

function slugify(text) {
    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ł/g, "l")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
}

function setMsg(text, isErr = false) {
    msg.textContent = text;
    msg.className = isErr ? "msg err" : "msg";
}
