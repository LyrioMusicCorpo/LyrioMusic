<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tłumaczenia — LyrioMusic</title>
<script>
(function () {
    try {
        var t = localStorage.getItem("lyrio-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
    } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=20261121-5">
<style>
    .tr-head {
        padding: 36px 0 24px;
        border-bottom: 1px solid var(--line);
    }
    .tr-head h1 {
        font-family: var(--serif);
        font-size: 34px;
        margin-bottom: 8px;
    }
    .tr-head p {
        color: var(--muted);
        font-size: 15px;
    }
    .tr-list {
        display: grid;
        gap: 18px;
        padding: 28px 0 24px;
    }
    .tr-card {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 20px;
    }
    .tr-card-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px 12px;
        margin-bottom: 4px;
    }
    .tr-title {
        font-family: var(--serif);
        font-size: 22px;
    }
    .tr-title a { text-decoration: none; }
    .tr-title a:hover { text-decoration: underline; }
    .tr-meta {
        font-size: 13px;
        color: var(--muted);
    }
    .tr-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 12px;
    }
    @media (max-width: 720px) {
        .tr-cols { grid-template-columns: 1fr; }
    }
    .tr-box {
        border-top: 1px solid var(--line);
        padding-top: 10px;
        font-size: 14px;
        line-height: 1.6;
    }
    .tr-text {
        white-space: pre-line;
        max-height: 320px;
        overflow-y: auto;
    }
    .tr-label {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin-bottom: 6px;
    }
    .tr-status {
        color: var(--muted);
        font-size: 15px;
        padding: 28px 0 0;
    }
    .tr-more {
        display: block;
        margin: 0 auto 56px;
        padding: 11px 22px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
    }
    .tr-more:hover { border-color: var(--text); }
    .tr-more:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

<header class="site-header">
    <div class="wrap">
        <a href="./" class="logo">Lyrio<span>Music</span></a>
        <nav aria-label="Główna nawigacja">
            <a href="./#teksty">Teksty</a>
            <a href="./#wykonawcy">Wykonawcy</a>
            <a href="./tlumaczenia.html" aria-current="page">Tłumaczenia</a>
            <a href="./dodaj-tekst.html">Dodaj tekst</a>
        </nav>
        <a href="./logowanie.html" class="login">Zaloguj się</a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ciemny motyw" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
            </svg>
        </button>
    </div>
</header>

<main class="wrap">
    <section class="tr-head">
        <h1>Tłumaczenia utworów</h1>
        <p>Oryginalne teksty obok tłumaczeń przesłanych przez użytkowników. Każde tłumaczenie przechodzi moderację. Chcesz dodać własne? Wejdź na stronę dowolnego utworu.</p>
    </section>

    <p class="tr-status" id="trStatus">Ładowanie tłumaczeń...</p>
    <section class="tr-list" id="translationsList" aria-live="polite"></section>
    <button type="button" class="tr-more" id="trMore" style="display:none;">Pokaż więcej</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oxkstekhjumgbdjzxsdr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IU3Bb6fXNt6mZlJGx3JHjA_Ff_Otitd";
const PAGE_SIZE = 20;

const root = document.documentElement;
const toggle = document.getElementById("themeToggle");
function applyTheme(t) {
    root.dataset.theme = t;
    if (toggle) toggle.setAttribute("aria-pressed", t === "dark");
}
applyTheme(root.dataset.theme || "light");
if (toggle) {
    toggle.addEventListener("click", () => {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem("lyrio-theme", next); } catch (e) {}
    });
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const listEl = document.getElementById("translationsList");
const statusEl = document.getElementById("trStatus");
const moreBtn = document.getElementById("trMore");
let offset = 0;

function one(value) {
    return Array.isArray(value) ? value[0] : value;
}

function langName(code) {
    try {
        const name = new Intl.DisplayNames(["pl"], { type: "language" }).of(code);
        if (name) return name.charAt(0).toUpperCase() + name.slice(1);
    } catch (e) {}
    return String(code || "").toUpperCase();
}

function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function box(label, text) {
    const wrap = el("div", "tr-box");
    wrap.appendChild(el("div", "tr-label", label));
    wrap.appendChild(el("div", "tr-text", text || ""));
    return wrap;
}

function renderCard(item) {
    const song = one(item.songs) || {};
    const artist = one(song.artists);

    const card = el("article", "tr-card");

    const top = el("div", "tr-card-top");
    const title = el("h2", "tr-title");
    if (song.slug) {
        const a = document.createElement("a");
        a.href = "./utwor.html?slug=" + encodeURIComponent(song.slug);
        a.textContent = song.title || "Bez tytułu";
        title.appendChild(a);
    } else {
        title.textContent = song.title || "Bez tytułu";
    }
    top.appendChild(title);
    top.appendChild(el("span", "tr-meta", (artist ? artist.name : "Wykonawca nieznany") + " • " + langName(item.language)));
    card.appendChild(top);

    const cols = el("div", "tr-cols");
    cols.appendChild(box("Oryginał", song.lyrics));
    cols.appendChild(box("Tłumaczenie (" + langName(item.language) + ")", item.content));
    card.appendChild(cols);

    return card;
}

async function loadPage() {
    moreBtn.disabled = true;
    const { data, error } = await sb
        .from("translations")
        .select("id, language, content, created_at, songs(title, slug, lyrics, artists(name))")
        .eq("status", "approved")
        .order("created_at", { ascending: false })
        .range(offset, offset + PAGE_SIZE - 1);

    if (error) {
        console.error("Błąd ładowania tłumaczeń:", error.code, error.message, error.details, error.hint);
        statusEl.textContent = "Nie udało się załadować tłumaczeń (kod: " + (error.code || "brak") + (error.message ? ", " + error.message : "") + ").";
        statusEl.style.display = "";
        moreBtn.style.display = "none";
        return;
    }

    const items = Array.isArray(data) ? data : [];
    if (offset === 0 && items.length === 0) {
        statusEl.textContent = "Nie ma jeszcze żadnych tłumaczeń. Pierwsze możesz zaproponować na stronie dowolnego utworu.";
        statusEl.style.display = "";
        moreBtn.style.display = "none";
        return;
    }

    statusEl.style.display = "none";
    items.forEach(item => listEl.appendChild(renderCard(item)));
    offset += items.length;

    moreBtn.disabled = false;
    moreBtn.style.display = items.length === PAGE_SIZE ? "block" : "none";
}

moreBtn.addEventListener("click", loadPage);
loadPage();
</script>
</body>
</html>
