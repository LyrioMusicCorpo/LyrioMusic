<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaloguj się — LyrioMusic</title>
<script>
(function () {
    try {
        var t = localStorage.getItem("lyrio-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
    } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=20261121-5">
<style>
    .login-box {
        max-width: 420px;
        margin: 56px auto;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 6px;
    }
    .login-box h1 {
        font-family: var(--serif);
        font-size: 30px;
        margin-bottom: 8px;
    }
    .login-box p.sub {
        color: var(--muted);
        margin-bottom: 22px;
        font-size: 14px;
    }
    .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-bottom: 22px;
        border-bottom: 1px solid var(--line);
    }
    .tab {
        padding: 10px 0;
        border: 0;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .tab[aria-selected="true"] {
        color: var(--text);
        border-bottom-color: var(--text);
    }
    .field { margin-bottom: 16px; }
    .field label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
    }
    .field input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
    }
    .field[hidden] { display: none; }
    .login-btn {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 4px;
        background: var(--text);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
    }
    .login-btn:hover { background: var(--accent); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
        margin-top: 14px;
        font-size: 14px;
        color: var(--muted);
        min-height: 20px;
    }
    .msg.err { color: var(--accent); }
    .back-link {
        display: inline-block;
        margin-top: 18px;
        font-size: 14px;
        color: var(--muted);
        text-decoration: underline;
    }
</style>
</head>
<body>

<main class="wrap">
    <section class="login-box">
        <h1 id="title">Zaloguj się</h1>
        <p class="sub" id="sub">Wpisz e-mail i hasło.</p>

        <div class="tabs" role="tablist" aria-label="Logowanie lub rejestracja">
            <button type="button" class="tab" id="tabLogin" role="tab" aria-selected="true">Zaloguj się</button>
            <button type="button" class="tab" id="tabSignup" role="tab" aria-selected="false">Załóż konto</button>
        </div>

        <form id="authForm">
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" type="email" required autocomplete="email" placeholder="twoj@gmail.com">
            </div>
            <div class="field">
                <label for="password">Hasło</label>
                <input id="password" type="password" required autocomplete="current-password">
            </div>
            <div class="field" id="password2Field" hidden>
                <label for="password2">Powtórz hasło</label>
                <input id="password2" type="password" autocomplete="new-password">
            </div>
            <button type="submit" class="login-btn" id="submitBtn">Zaloguj się</button>
        </form>

        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <a href="./" class="back-link">← Wróć na stronę główną</a>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oxkstekhjumgbdjzxsdr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IU3Bb6fXNt6mZlJGx3JHjA_Ff_Otitd";
const MIN_PASSWORD = 10;

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("authForm");
const emailEl = document.getElementById("email");
const passEl = document.getElementById("password");
const pass2El = document.getElementById("password2");
const pass2Field = document.getElementById("password2Field");
const btn = document.getElementById("submitBtn");
const msg = document.getElementById("msg");
const title = document.getElementById("title");
const sub = document.getElementById("sub");
const tabLogin = document.getElementById("tabLogin");
const tabSignup = document.getElementById("tabSignup");

let mode = "login";

function setMsg(text, isErr) {
    msg.textContent = text;
    msg.className = isErr ? "msg err" : "msg";
}

function setMode(next) {
    mode = next;
    const signup = mode === "signup";
    tabLogin.setAttribute("aria-selected", String(!signup));
    tabSignup.setAttribute("aria-selected", String(signup));
    title.textContent = signup ? "Załóż konto" : "Zaloguj się";
    sub.textContent = signup
        ? "Podaj e-mail i hasło. Wyślemy link potwierdzający."
        : "Wpisz e-mail i hasło.";
    btn.textContent = signup ? "Załóż konto" : "Zaloguj się";
    pass2Field.hidden = !signup;
    pass2El.required = signup;
    pass2El.value = "";
    passEl.autocomplete = signup ? "new-password" : "current-password";
    if (signup) {
        passEl.minLength = MIN_PASSWORD;
        passEl.placeholder = "Minimum " + MIN_PASSWORD + " znaków";
    } else {
        passEl.removeAttribute("minlength");
        passEl.placeholder = "";
    }
    setMsg("", false);
}

tabLogin.addEventListener("click", () => setMode("login"));
tabSignup.addEventListener("click", () => setMode("signup"));

function plError(err) {
    const code = err && err.code ? err.code : "";
    const text = (err && err.message) ? err.message : "";
    if (code === "invalid_credentials" || /invalid login credentials/i.test(text)) {
        return "Nieprawidłowy e-mail lub hasło.";
    }
    if (code === "email_not_confirmed" || /email not confirmed/i.test(text)) {
        return "Konto nie jest jeszcze potwierdzone. Kliknij link w mailu, który dostałeś po rejestracji.";
    }
    if (code === "weak_password" || /password should be/i.test(text)) {
        return "Hasło jest za słabe. Użyj co najmniej " + MIN_PASSWORD + " znaków.";
    }
    if (/rate limit/i.test(text) || code === "over_email_send_rate_limit" || code === "over_request_rate_limit") {
        return "Zbyt wiele prób. Odczekaj chwilę i spróbuj ponownie.";
    }
    if (code === "signup_disabled") {
        return "Rejestracja jest chwilowo wyłączona.";
    }
    return "Coś poszło nie tak. Spróbuj ponownie za chwilę.";
}

function goHome() {
    window.location.href = "./";
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = emailEl.value.trim();
    const password = passEl.value;

    if (mode === "signup") {
        if (password.length < MIN_PASSWORD) {
            setMsg("Hasło musi mieć co najmniej " + MIN_PASSWORD + " znaków.", true);
            return;
        }
        if (password !== pass2El.value) {
            setMsg("Hasła nie są takie same.", true);
            return;
        }
    }

    btn.disabled = true;

    if (mode === "login") {
        setMsg("Sprawdzanie konta...", false);
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error || !data || !data.session) {
            btn.disabled = false;
            setMsg(plError(error), true);
            return;
        }
        setMsg("Zalogowano. Przekierowanie...", false);
        goHome();
        return;
    }

    setMsg("Zakładanie konta...", false);
    const { data, error } = await sb.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: new URL("./", window.location.href).href }
    });

    if (error) {
        btn.disabled = false;
        setMsg(plError(error), true);
        return;
    }

    if (data && data.session) {
        setMsg("Konto utworzone. Przekierowanie...", false);
        goHome();
        return;
    }

    btn.disabled = false;
    form.reset();
    setMsg("Gotowe. Jeśli ten adres nie ma jeszcze konta, wysłaliśmy na niego link potwierdzający. Kliknij go, a potem wróć tu i zaloguj się. Sprawdź też spam.", false);
});

sb.auth.getSession().then(({ data }) => {
    if (data && data.session) goHome();
});

setMode("login");
</script>
    <script src="powiadomienie.js"></script>
</body>
</html>
