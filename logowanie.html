<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logowanie — LyrioMusic</title>
<script>
(function () {
    try {
        var t = localStorage.getItem("lyrio-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
    } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=20261121-3">
<style>
    .auth-box {
        max-width: 420px;
        margin: 48px auto;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 6px;
    }
    .auth-box h1 {
        font-family: var(--serif);
        font-size: 32px;
        margin-bottom: 8px;
    }
    .auth-box p.sub {
        color: var(--muted);
        margin-bottom: 20px;
        font-size: 15px;
    }
    .field {
        margin-bottom: 14px;
    }
    .field label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
    }
    .field input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
    }
    .auth-btn {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--text);
        border-radius: 4px;
        background: var(--text);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .auth-btn:hover {
        background: var(--accent);
        border-color: var(--accent);
    }
    .auth-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    .auth-btn-secondary {
        background: transparent;
        color: var(--text);
        border-color: var(--line);
    }
    .auth-btn-secondary:hover {
        background: transparent;
        border-color: var(--text);
    }
    .logged-box {
        display: none;
        margin-top: 8px;
    }
    .logged-info {
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 4px;
        margin-bottom: 14px;
        font-size: 14px;
    }
    .logged-info span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
    }
    .logged-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }
    .msg {
        margin-top: 14px;
        font-size: 14px;
        color: var(--muted);
        min-height: 20px;
    }
    .msg.err { color: var(--accent); }
    .back-link {
        display: inline-block;
        margin-top: 18px;
        font-size: 14px;
        color: var(--muted);
        text-decoration: underline;
    }
    .header-panel-link {
        display: none;
        margin-left: 12px;
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
    }
    .header-panel-link:hover { border-color: var(--text); }
</style>
</head>
<body>

<header class="site-header">
    <div class="wrap">
        <a href="./" class="logo">Lyrio<span>Music</span></a>
        <nav aria-label="Główna nawigacja">
            <a href="./#teksty">Teksty</a>
            <a href="./#wykonawcy">Wykonawcy</a>
            <a href="./dodaj-tekst.html">Dodaj tekst</a>
            <a href="./admin.html" class="header-panel-link" id="headerPanelBtn">Panel</a>
        </nav>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ciemny motyw" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
            </svg>
        </button>
    </div>
</header>

<main class="wrap">
    <section class="auth-box">
        <h1>Zaloguj się</h1>
        <p class="sub" id="authSub">Dostęp przez konto Supabase Auth.</p>

        <form id="loginForm" autocomplete="on">
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" required autocomplete="email" placeholder="ty@domena.pl">
            </div>
            <div class="field">
                <label for="password">Hasło</label>
                <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="auth-btn" id="loginBtn">Zaloguj się</button>
        </form>

        <div class="logged-box" id="loggedBox">
            <div class="logged-info">
                <strong id="loggedEmail"></strong>
                <span id="roleStatus">Sprawdzanie uprawnień...</span>
            </div>
            <div class="logged-actions">
                <a href="./admin.html" class="auth-btn" id="panelBtn">Panel</a>
                <button type="button" class="auth-btn auth-btn-secondary" id="logoutBtn">Wyloguj się</button>
            </div>
        </div>

        <div class="msg" id="authMsg" role="status" aria-live="polite"></div>
        <a href="./" class="back-link">← Wróć na stronę główną</a>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oxkstekhjumgbdjzxsdr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IU3Bb6fXNt6mZlJGx3JHjA_Ff_Otitd";

const root = document.documentElement;
const toggle = document.getElementById("themeToggle");
function applyTheme(t) {
    root.dataset.theme = t;
    if (toggle) toggle.setAttribute("aria-pressed", t === "dark");
}
applyTheme(root.dataset.theme || "light");
if (toggle) {
    toggle.addEventListener("click", () => {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem("lyrio-theme", next); } catch (e) {}
    });
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("authMsg");
const loggedBox = document.getElementById("loggedBox");
const loggedEmail = document.getElementById("loggedEmail");
const roleStatus = document.getElementById("roleStatus");
const panelBtn = document.getElementById("panelBtn");
const headerPanelBtn = document.getElementById("headerPanelBtn");
const logoutBtn = document.getElementById("logoutBtn");
const authSub = document.getElementById("authSub");

function setMsg(text, isErr = false) {
    msg.textContent = text;
    msg.className = isErr ? "msg err" : "msg";
}

async function showLoggedInState(user) {
    if (!user) {
        form.style.display = "block";
        loggedBox.style.display = "none";
        headerPanelBtn.style.display = "none";
        authSub.textContent = "Dostęp przez konto Supabase Auth.";
        return;
    }

    form.style.display = "none";
    loggedBox.style.display = "block";
    loggedEmail.textContent = `Zalogowano jako: ${user.email || user.id}`;
    authSub.textContent = "Sesja jest aktywna.";
    roleStatus.textContent = "Sprawdzanie roli w bazie...";
    setMsg("");

    const { data, error } = await sb
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id)
        .limit(1);

    if (error) {
        roleStatus.textContent = `Błąd odczytu roli: ${error.message}`;
        panelBtn.style.display = "none";
        headerPanelBtn.style.display = "none";
        return;
    }

    const row = Array.isArray(data) ? data[0] : null;
    if (row && row.role === "admin") {
        roleStatus.textContent = "Rola: admin — masz dostęp do panelu.";
        panelBtn.style.display = "inline-flex";
        headerPanelBtn.style.display = "inline-flex";
    } else {
        roleStatus.textContent = "Rola: zwykły użytkownik (brak dostępu do panelu admina).";
        panelBtn.style.display = "none";
        headerPanelBtn.style.display = "none";
    }
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    setMsg("Logowanie...");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    btn.disabled = false;
    if (error) {
        setMsg(`Błąd logowania: ${error.message}`, true);
        return;
    }

    await showLoggedInState(data.user);
});

logoutBtn.addEventListener("click", async () => {
    await sb.auth.signOut();
    await showLoggedInState(null);
    setMsg("Wylogowano.");
});

sb.auth.getSession().then(({ data }) => {
    if (data?.session?.user) {
        showLoggedInState(data.session.user);
    }
});
</script>
</body>
</html>
