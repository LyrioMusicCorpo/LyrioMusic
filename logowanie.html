<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaloguj się — LyrioMusic</title>
<script>
(function () {
    try {
        var t = localStorage.getItem("lyrio-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
    } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=20261121-5">
<style>
    .login-box {
        max-width: 420px;
        margin: 56px auto;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 6px;
    }
    .login-box h1 {
        font-family: var(--serif);
        font-size: 30px;
        margin-bottom: 8px;
    }
    .login-box p.sub {
        color: var(--muted);
        margin-bottom: 22px;
        font-size: 14px;
    }
    .field { margin-bottom: 16px; }
    .field label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
    }
    .field input {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
    }
    .login-btn {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 4px;
        background: var(--text);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
    }
    .login-btn:hover { background: var(--accent); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
        margin-top: 14px;
        font-size: 14px;
        color: var(--muted);
        min-height: 20px;
    }
    .msg.err { color: var(--accent); }
    .back-link {
        display: inline-block;
        margin-top: 18px;
        font-size: 14px;
        color: var(--muted);
        text-decoration: underline;
    }
</style>
</head>
<body>

<main class="wrap">
    <section class="login-box">
        <h1>Zaloguj się</h1>
        <p class="sub">Wpisz Gmaila i hasło — nowe konto utworzy się automatycznie.</p>

        <form id="loginForm">
            <div class="field">
                <label for="email">Gmail / E-mail</label>
                <input id="email" type="email" required autocomplete="email" placeholder="twoj@gmail.com">
            </div>
            <div class="field">
                <label for="password">Hasło</label>
                <input id="password" type="password" required autocomplete="current-password" minlength="6" placeholder="Minimum 6 znaków">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Wejdź</button>
        </form>

        <div class="msg" id="loginMsg" role="status" aria-live="polite"></div>
        <a href="./" class="back-link">← Wróć na stronę główną</a>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oxkstekhjumgbdjzxsdr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IU3Bb6fXNt6mZlJGx3JHjA_Ff_Otitd";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const msg = document.getElementById("loginMsg");

function setMsg(text, isErr = false) {
    msg.textContent = text;
    msg.className = isErr ? "msg err" : "msg";
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    btn.disabled = true;
    setMsg("Sprawdzanie konta...");

    const { data: signInData, error: signInError } = await sb.auth.signInWithPassword({
        email,
        password
    });

    if (!signInError && signInData?.session) {
        setMsg("Zalogowano. Przekierowanie...");
        window.location.href = "./";
        return;
    }

    const isInvalidCreds = /invalid login credentials/i.test(signInError?.message || "");
    if (!isInvalidCreds) {
        btn.disabled = false;
        setMsg("Błąd logowania: " + (signInError?.message || "Nieznany błąd"), true);
        return;
    }

    setMsg("Tworzenie nowego konta użytkownika...");
    const { data: signUpData, error: signUpError } = await sb.auth.signUp({
        email,
        password
    });

    if (signUpError) {
        btn.disabled = false;
        setMsg("Nie udało się utworzyć konta: " + signUpError.message, true);
        return;
    }

    if (signUpData?.session) {
        setMsg("Konto utworzone! Witamy na LyrioMusic...");
        window.location.href = "./";
        return;
    }

    const { data: retryData, error: retryError } = await sb.auth.signInWithPassword({
        email,
        password
    });

    btn.disabled = false;
    if (!retryError && retryData?.session) {
        window.location.href = "./";
    } else {
        setMsg("Konto utworzone, ale wymagane jest potwierdzenie e-maila. Sprawdź skrzynkę albo wyłącz potwierdzanie maila w ustawieniach Auth w Supabase.", true);
    }
});
</script>
</body>
</html>
