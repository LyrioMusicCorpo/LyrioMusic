<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tekst utworu — LyrioMusic</title>
<script>
(function () {
    try {
        var t = localStorage.getItem("lyrio-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
    } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=20261121-5">
<style>
    .song-wrap {
        max-width: 760px;
        margin: 40px auto 64px;
    }
    .song-back {
        display: inline-block;
        margin-bottom: 20px;
        font-size: 14px;
        color: var(--muted);
        text-decoration: underline;
    }
    .song-artist {
        font-size: 15px;
        color: var(--muted);
        margin-bottom: 6px;
    }
    .song-title {
        font-family: var(--serif);
        font-size: 36px;
        line-height: 1.2;
        margin-bottom: 24px;
    }
    .song-player {
        margin-bottom: 28px;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
        background: #000;
        display: none;
    }
    .song-player.video { aspect-ratio: 16 / 9; }
    .song-player.spotify { height: 152px; background: transparent; }
    .song-player.soundcloud { height: 166px; background: transparent; }
    .song-player iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }
    .song-lyrics {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 6px;
        white-space: pre-line;
        line-height: 1.75;
        font-size: 16px;
    }
    .song-msg {
        color: var(--muted);
        font-size: 15px;
    }

    .tr-section { margin-top: 44px; }
    .tr-section h2 {
        font-family: var(--serif);
        font-size: 26px;
        margin-bottom: 14px;
    }
    .tr-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 12px;
    }
    .tr-tab {
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
    }
    .tr-tab[aria-selected="true"] {
        background: var(--text);
        border-color: var(--text);
        color: var(--bg);
    }
    .tr-form {
        margin-top: 32px;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 6px;
    }
    .tr-form h3 {
        font-family: var(--serif);
        font-size: 20px;
        margin-bottom: 6px;
    }
    .tr-form p.sub {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 18px;
    }
    .field { margin-bottom: 16px; }
    .field[hidden] { display: none; }
    .field label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
    }
    .field select option { color: #111; background: #fff; }
    .field textarea {
        min-height: 200px;
        resize: vertical;
        line-height: 1.6;
    }
    .submit-btn {
        padding: 12px 22px;
        border: 0;
        border-radius: 4px;
        background: var(--text);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
    }
    .submit-btn:hover { background: var(--accent); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
        margin-top: 14px;
        font-size: 14px;
        color: var(--muted);
        min-height: 20px;
    }
    .msg.err { color: var(--accent); }
</style>
</head>
<body>

<header class="site-header">
    <div class="wrap">
        <a href="./" class="logo">Lyrio<span>Music</span></a>
        <nav aria-label="Główna nawigacja">
            <a href="./#teksty">Teksty</a>
            <a href="./#wykonawcy">Wykonawcy</a>
            <a href="./dodaj-tekst.html">Dodaj tekst</a>
        </nav>
        <a href="./logowanie.html" class="login">Zaloguj się</a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ciemny motyw" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
            </svg>
        </button>
    </div>
</header>

<main class="wrap">
    <article class="song-wrap">
        <a href="./" class="song-back">← Wróć do utworów</a>
        <p class="song-msg" id="songStatus">Ładowanie utworu...</p>

        <div id="songArticle" style="display:none;">
            <div class="song-artist" id="songArtist"></div>
            <h1 class="song-title" id="songTitle"></h1>

            <div class="song-player" id="songPlayerWrap">
                <iframe
                    id="songPlayerFrame"
                    title="Odtwarzacz"
                    sandbox="allow-scripts allow-same-origin allow-presentation allow-popups allow-popups-to-escape-sandbox"
                    allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
            </div>

            <div class="song-lyrics" id="songLyrics"></div>

            <section class="tr-section" aria-labelledby="trHeading">
                <h2 id="trHeading">Tłumaczenia</h2>
                <p class="song-msg" id="trEmpty">Ładowanie tłumaczeń...</p>
                <div class="tr-tabs" id="trTabs" role="tablist" aria-label="Języki tłumaczeń"></div>
                <div class="song-lyrics" id="trContent" style="display:none;"></div>

                <form class="tr-form" id="trForm">
                    <h3>Zaproponuj tłumaczenie</h3>
                    <p class="sub">Tłumaczenie trafi do moderacji. Po akceptacji pojawi się na tej stronie.</p>
                    <div class="field">
                        <label for="trLang">Język tłumaczenia</label>
                        <select id="trLang">
                            <option value="pl">Polski</option>
                            <option value="en">Angielski</option>
                            <option value="de">Niemiecki</option>
                            <option value="es">Hiszpański</option>
                            <option value="fr">Francuski</option>
                            <option value="it">Włoski</option>
                            <option value="pt">Portugalski</option>
                            <option value="uk">Ukraiński</option>
                            <option value="ru">Rosyjski</option>
                            <option value="cs">Czeski</option>
                            <option value="ja">Japoński</option>
                            <option value="ko">Koreański</option>
                            <option value="__other">Inny język…</option>
                        </select>
                    </div>
                    <div class="field" id="trOtherField" hidden>
                        <label for="trOther">Kod języka (2 litery)</label>
                        <input id="trOther" type="text" maxlength="2" pattern="[A-Za-z]{2}" placeholder="np. nl">
                    </div>
                    <div class="field">
                        <label for="trText">Tłumaczenie</label>
                        <textarea id="trText" required maxlength="20000" placeholder="Wklej lub wpisz tłumaczenie tekstu..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="trBtn">Wyślij do akceptacji</button>
                    <div class="msg" id="trMsg" role="status" aria-live="polite"></div>
                </form>
            </section>
        </div>
    </article>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oxkstekhjumgbdjzxsdr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IU3Bb6fXNt6mZlJGx3JHjA_Ff_Otitd";

const root = document.documentElement;
const toggle = document.getElementById("themeToggle");
function applyTheme(t) {
    root.dataset.theme = t;
    if (toggle) toggle.setAttribute("aria-pressed", t === "dark");
}
applyTheme(root.dataset.theme || "light");
if (toggle) {
    toggle.addEventListener("click", () => {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem("lyrio-theme", next); } catch (e) {}
    });
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ID_PATTERNS = {
    youtube: /^[A-Za-z0-9_-]{11}$/,
    spotify: /^[A-Za-z0-9]{22}$/,
    soundcloud: /^[A-Za-z0-9_-]{1,50}\/[A-Za-z0-9_-]{1,100}$/
};

function extractYouTubeId(rawUrl) {
    if (!rawUrl) return null;
    const trimmed = String(rawUrl).trim();
    if (ID_PATTERNS.youtube.test(trimmed)) return trimmed;
    try {
        const url = new URL(trimmed);
        const host = url.hostname.replace(/^www\./, "");
        const allowedHosts = new Set(["youtube.com", "m.youtube.com", "music.youtube.com", "youtu.be", "youtube-nocookie.com"]);
        if (!allowedHosts.has(host)) return null;
        if (host === "youtu.be") {
            const id = url.pathname.split("/").filter(Boolean)[0];
            return id && ID_PATTERNS.youtube.test(id) ? id : null;
        }
        const v = url.searchParams.get("v");
        if (v && ID_PATTERNS.youtube.test(v)) return v;
        const parts = url.pathname.split("/").filter(Boolean);
        const i = parts.findIndex(p => p === "embed" || p === "shorts" || p === "live");
        if (i !== -1 && parts[i + 1] && ID_PATTERNS.youtube.test(parts[i + 1])) return parts[i + 1];
    } catch (e) {
        return null;
    }
    return null;
}

function resolveMedia(song) {
    const provider = song.media_provider;
    const id = song.media_id;
    if (provider && id && ID_PATTERNS[provider] && ID_PATTERNS[provider].test(id)) {
        return { provider, id };
    }
    const legacy = extractYouTubeId(song.youtube_url);
    if (legacy) return { provider: "youtube", id: legacy };
    return null;
}

function embedUrl(media) {
    if (media.provider === "youtube") return "https://www.youtube.com/embed/" + encodeURIComponent(media.id);
    if (media.provider === "spotify") return "https://open.spotify.com/embed/track/" + encodeURIComponent(media.id);
    return "https://w.soundcloud.com/player/?url=" + encodeURIComponent("https://soundcloud.com/" + media.id);
}

const PLAYER_TITLES = {
    youtube: "Odtwarzacz YouTube",
    spotify: "Odtwarzacz Spotify",
    soundcloud: "Odtwarzacz SoundCloud"
};

function showPlayer(media) {
    const wrap = document.getElementById("songPlayerWrap");
    const frame = document.getElementById("songPlayerFrame");
    if (!media) {
        wrap.style.display = "none";
        return;
    }
    wrap.className = "song-player " + (media.provider === "youtube" ? "video" : media.provider);
    frame.title = PLAYER_TITLES[media.provider];
    frame.src = embedUrl(media);
    wrap.style.display = "block";
}

async function loadSong() {
    const statusEl = document.getElementById("songStatus");
    const articleEl = document.getElementById("songArticle");
    const params = new URLSearchParams(window.location.search);
    const idParam = params.get("id");
    const slugParam = params.get("slug");

    if (!idParam && !slugParam) {
        statusEl.textContent = "Brak identyfikatora utworu w adresie.";
        return;
    }

    let query = sb
        .from("songs")
        .select("id, title, slug, lyrics, media_provider, media_id, youtube_url, artists(name)");

    if (slugParam) {
        query = query.eq("slug", slugParam);
    } else if (/^[0-9a-fA-F-]{36}$/.test(idParam)) {
        query = query.eq("id", idParam);
    } else {
        query = query.eq("slug", idParam);
    }

    const { data, error } = await query.limit(1);

    if (error) {
        statusEl.textContent = "Nie udało się załadować utworu. Spróbuj ponownie za chwilę.";
        console.error(error);
        return;
    }

    const song = Array.isArray(data) ? data[0] : null;
    if (!song) {
        statusEl.textContent = "Nie znaleziono takiego utworu.";
        return;
    }

    const artistName = Array.isArray(song.artists) ? song.artists[0]?.name : song.artists?.name;
    document.title = `${song.title} — LyrioMusic`;
    document.getElementById("songArtist").textContent = artistName || "Wykonawca nieznany";
    document.getElementById("songTitle").textContent = song.title;
    document.getElementById("songLyrics").textContent = song.lyrics || "";

    showPlayer(resolveMedia(song));

    statusEl.style.display = "none";
    articleEl.style.display = "block";

    initTranslations(song.id);
}

function langName(code) {
    try {
        const name = new Intl.DisplayNames(["pl"], { type: "language" }).of(code);
        if (name) return name.charAt(0).toUpperCase() + name.slice(1);
    } catch (e) {}
    return String(code).toUpperCase();
}

const TR_ERRORS = {
    not_authenticated: "Zaloguj się, żeby zaproponować tłumaczenie.",
    invalid_language: "Niepoprawny język. Podaj dwuliterowy kod, np. en.",
    invalid_content: "Tłumaczenie ma mieć od 1 do 20000 znaków.",
    song_not_found: "Nie znaleziono tego utworu.",
    rate_limited: "Wysłano już maksymalną liczbę zgłoszeń na dziś. Spróbuj jutro.",
    too_many_pending: "Masz za dużo zgłoszeń czekających na akceptację."
};

function trErrText(err) {
    const text = String((err && err.message) || "");
    return TR_ERRORS[text] || "Coś poszło nie tak. Spróbuj ponownie za chwilę.";
}

async function loadTranslations(songId) {
    const emptyEl = document.getElementById("trEmpty");
    const tabsEl = document.getElementById("trTabs");
    const contentEl = document.getElementById("trContent");

    const { data, error } = await sb
        .from("translations")
        .select("id, language, content")
        .eq("song_id", songId)
        .eq("status", "approved")
        .order("created_at", { ascending: true });

    if (error) {
        console.error(error);
        emptyEl.textContent = "Nie udało się załadować tłumaczeń.";
        return;
    }

    const items = Array.isArray(data) ? data : [];
    tabsEl.textContent = "";
    if (items.length === 0) {
        emptyEl.textContent = "Ten utwór nie ma jeszcze tłumaczeń.";
        emptyEl.style.display = "";
        contentEl.style.display = "none";
        return;
    }
    emptyEl.style.display = "none";

    const seen = {};
    const buttons = [];
    function select(i) {
        buttons.forEach((b, j) => b.setAttribute("aria-selected", String(i === j)));
        contentEl.textContent = items[i].content || "";
        contentEl.style.display = "block";
    }
    items.forEach((item, i) => {
        seen[item.language] = (seen[item.language] || 0) + 1;
        const n = seen[item.language];
        const b = document.createElement("button");
        b.type = "button";
        b.className = "tr-tab";
        b.setAttribute("role", "tab");
        b.textContent = langName(item.language) + (n > 1 ? " (" + n + ")" : "");
        b.addEventListener("click", () => select(i));
        tabsEl.appendChild(b);
        buttons.push(b);
    });
    select(0);
}

async function initTranslations(songId) {
    const form = document.getElementById("trForm");
    const langEl = document.getElementById("trLang");
    const otherField = document.getElementById("trOtherField");
    const otherEl = document.getElementById("trOther");
    const textEl = document.getElementById("trText");
    const btn = document.getElementById("trBtn");
    const msg = document.getElementById("trMsg");

    function setMsg(text, isErr) {
        msg.textContent = text;
        msg.className = isErr ? "msg err" : "msg";
    }

    loadTranslations(songId);

    const { data } = await sb.auth.getSession();
    const user = (data && data.session && data.session.user) || null;
    if (!user) {
        form.querySelectorAll("select, input, textarea, button").forEach(el => { el.disabled = true; });
        msg.className = "msg";
        msg.textContent = "Żeby zaproponować tłumaczenie, ";
        const link = document.createElement("a");
        link.href = "./logowanie.html";
        link.textContent = "zaloguj się";
        link.style.textDecoration = "underline";
        msg.append(link, ".");
        return;
    }

    langEl.addEventListener("change", () => {
        const other = langEl.value === "__other";
        otherField.hidden = !other;
        otherEl.required = other;
    });

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const lang = langEl.value === "__other" ? otherEl.value.trim().toLowerCase() : langEl.value;
        const content = textEl.value.trim();
        if (!/^[a-z]{2}$/.test(lang)) {
            setMsg(TR_ERRORS.invalid_language, true);
            return;
        }
        if (!content) return;

        btn.disabled = true;
        setMsg("Wysyłanie...", false);
        const { error } = await sb.rpc("submit_translation", {
            p_song_id: songId,
            p_language: lang,
            p_content: content
        });
        btn.disabled = false;
        if (error) {
            setMsg("Nie udało się wysłać: " + trErrText(error), true);
            return;
        }
        form.reset();
        otherField.hidden = true;
        otherEl.required = false;
        setMsg("Tłumaczenie wysłane! Czeka na akceptację administratora.", false);
    });
}

loadSong();
</script>
</body>
</html>
