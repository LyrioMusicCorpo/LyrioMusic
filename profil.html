<!DOCTYPE html>
<html lang="pl">
<head>
    <link rel="icon" href="https://drive.google.com/file/d/1g35AczF4gNtFHe522g4NPbDzEjUxQNgK/view?usp=sharing">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil — LyrioMusic</title>
<script>
(function () {
    try {
        var t = localStorage.getItem("lyrio-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
    } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=20261121-4">
<style>
    .profile-wrap { max-width: 760px; margin: 40px auto 64px; }
    .profile-card {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 6px;
        margin-bottom: 28px;
    }
    .profile-card h1 { font-family: var(--serif); font-size: 32px; margin-bottom: 6px; }
    .profile-sub { color: var(--muted); font-size: 14px; }
    .edit-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .edit-row input {
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
    }
    .btn {
        padding: 9px 14px;
        border: 1px solid var(--text);
        border-radius: 4px;
        background: var(--text);
        color: var(--bg);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn:hover { background: var(--accent); border-color: var(--accent); }
    .songs-list { list-style: none; }
    .songs-list li {
        padding: 12px 0;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 12px;
    }
    .songs-list li:last-child { border-bottom: 1px solid var(--line); }
    .songs-list a { font-weight: 600; text-decoration: none; }
    .songs-list a:hover { text-decoration: underline; }
    .muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header class="site-header">
    <div class="wrap">
        <a href="./" class="logo">Lyrio<span>Music</span></a>
        <nav aria-label="Główna nawigacja">
            <a href="./#teksty">Teksty</a>
            <a href="./#wykonawcy">Wykonawcy</a>
            <a href="./dodaj-tekst.html">Dodaj tekst</a>
        </nav>
        <a href="./logowanie.html" class="login">Zaloguj się</a>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ciemny motyw" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
            </svg>
        </button>
    </div>
</header>

<main class="wrap">
    <section class="profile-wrap">
        <p class="muted" id="profileStatus">Ładowanie profilu...</p>

        <div class="profile-card" id="profileCard" style="display:none;">
            <h1 id="profileName"></h1>
            <div class="profile-sub" id="profileMeta"></div>

            <form class="edit-row" id="editNickForm" style="display:none;">
                <input type="text" id="nickInput" maxlength="32" required placeholder="Twój nick">
                <button type="submit" class="btn">Zapisz nick</button>
                <span class="muted" id="nickMsg" style="align-self:center;"></span>
            </form>
        </div>

        <div id="sharedSection" style="display:none;">
            <h2 style="font-family:var(--serif); font-size:22px; margin-bottom:12px;">Udostępnione teksty</h2>
            <ul class="songs-list" id="sharedSongsList"></ul>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oxkstekhjumgbdjzxsdr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IU3Bb6fXNt6mZlJGx3JHjA_Ff_Otitd";

const root = document.documentElement;
const toggle = document.getElementById("themeToggle");
function applyTheme(t) {
    root.dataset.theme = t;
    if (toggle) toggle.setAttribute("aria-pressed", t === "dark");
}
applyTheme(root.dataset.theme || "light");
if (toggle) {
    toggle.addEventListener("click", () => {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem("lyrio-theme", next); } catch (e) {}
    });
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function escapeHtml(str) {
    return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

async function initProfile() {
    const statusEl = document.getElementById("profileStatus");
    const params = new URLSearchParams(window.location.search);
    const idParam = params.get("id");
    const nameParam = params.get("name");

    const { data: sessionData } = await sb.auth.getSession();
    const currentUser = sessionData?.session?.user || null;
    const targetId = idParam || (!nameParam && currentUser ? currentUser.id : null);

    let displayUsername = nameParam ? nameParam.trim() : "";
    let profileRow = null;

    if (targetId) {
        const { data: pRows } = await sb
            .from("profiles")
            .select("id, username, created_at")
            .eq("id", targetId)
            .limit(1);
        profileRow = Array.isArray(pRows) ? pRows[0] : null;
        if (profileRow) displayUsername = profileRow.username;
    }

    if (!displayUsername && !profileRow) {
        statusEl.textContent = "Nie znaleziono profilu.";
        return;
    }

    document.title = `${displayUsername} — Profil LyrioMusic`;
    document.getElementById("profileName").textContent = displayUsername;
    document.getElementById("profileMeta").textContent = profileRow
        ? "Konto w LyrioMusic"
        : "Udostępniający bez konta";

    if (currentUser && profileRow && currentUser.id === profileRow.id) {
        const editForm = document.getElementById("editNickForm");
        const nickInput = document.getElementById("nickInput");
        editForm.style.display = "flex";
        nickInput.value = profileRow.username;

        editForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const newNick = nickInput.value.trim();
            const nickMsg = document.getElementById("nickMsg");
            if (!newNick) return;

            const { error } = await sb
                .from("profiles")
                .upsert({ id: currentUser.id, username: newNick });

            if (error) {
                nickMsg.textContent = "Błąd: " + error.message;
                return;
            }
            document.getElementById("profileName").textContent = newNick;
            nickMsg.textContent = "Zapisano.";
        });
    }

    let songsQuery = sb
        .from("songs")
        .select("id, title, slug, artists(name)")
        .order("id", { ascending: false });

    if (profileRow) {
        songsQuery = songsQuery.or(`submitted_by.eq.${profileRow.id},submitter_name.eq.${displayUsername}`);
    } else {
        songsQuery = songsQuery.eq("submitter_name", displayUsername);
    }

    const { data: songs } = await songsQuery;
    const listEl = document.getElementById("sharedSongsList");

    if (!songs || songs.length === 0) {
        listEl.innerHTML = '<li class="muted">Brak udostępnionych tekstów.</li>';
    } else {
        listEl.innerHTML = songs.map(s => {
            const artistName = Array.isArray(s.artists) ? s.artists[0]?.name : s.artists?.name;
            return `
                <li>
                    <a href="./utwor.html?id=${encodeURIComponent(s.id)}">${escapeHtml(s.title)}</a>
                    <span class="muted">${escapeHtml(artistName || "")}</span>
                </li>
            `;
        }).join("");
    }

    statusEl.style.display = "none";
    document.getElementById("profileCard").style.display = "block";
    document.getElementById("sharedSection").style.display = "block";
}

initProfile();
</script>
</body>
</html>
