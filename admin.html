<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel admina — LyrioMusic</title>
<script>
(function () {
    try {
        var t = localStorage.getItem("lyrio-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
    } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css?v=20261121-2">
<style>
    .admin-wrap { padding: 36px 0 56px; }
    .admin-top {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
    }
    .admin-top h1 { font-family: var(--serif); font-size: 32px; }
    .admin-actions { display: flex; gap: 12px; align-items: center; }
    .btn {
        padding: 10px 16px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn:hover { border-color: var(--text); }
    .btn-primary {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
    }
    .btn-primary:hover { background: var(--accent); border-color: var(--accent); }
    .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 36px;
        margin-bottom: 40px;
    }
    .card {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 6px;
        margin-bottom: 32px;
    }
    .grid-2 .card { margin-bottom: 0; }
    .card h2 { font-family: var(--serif); font-size: 22px; margin-bottom: 14px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font: inherit;
    }
    .field select option { background: var(--bg); color: var(--text); }
    .field textarea { min-height: 130px; resize: vertical; }
    .status-msg { margin-top: 12px; font-size: 14px; color: var(--muted); min-height: 20px; }
    .status-msg.err { color: var(--accent); }
    .item-list { list-style: none; }
    .item-list li {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
    }
    .item-list li:last-child { border-bottom: 1px solid var(--line); }
    .item-sub { display: block; font-size: 13px; color: var(--muted); }
    .lyrics-preview {
        margin-top: 8px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 13px;
        color: var(--muted);
        white-space: pre-wrap;
        max-height: 140px;
        overflow-y: auto;
    }
    .sub-iframe-wrap {
        margin-top: 10px;
        max-width: 380px;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
        background: #000;
    }
    .sub-iframe-wrap iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
    }
    .row-btns { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-ok {
        padding: 6px 12px;
        border: 1px solid var(--text);
        border-radius: 4px;
        background: var(--text);
        color: var(--bg);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }
    .btn-ok:hover { background: var(--accent); border-color: var(--accent); }
    .btn-del {
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
    }
    .btn-del:hover { color: var(--accent); border-color: var(--accent); }
    #adminContent { display: none; }
    @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="site-header">
    <div class="wrap">
        <a href="./" class="logo">Lyrio<span>Music</span></a>
        <nav aria-label="Główna nawigacja">
            <a href="./#teksty">Teksty</a>
            <a href="./#wykonawcy">Wykonawcy</a>
            <a href="./dodaj-tekst.html">Dodaj tekst</a>
        </nav>
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ciemny motyw" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
            </svg>
        </button>
    </div>
</header>

<main class="wrap admin-wrap">
    <p id="guardMsg" class="status-msg">Sprawdzanie sesji i uprawnień admina...</p>

    <div id="adminContent">
        <div class="admin-top">
            <div>
                <h1>Panel administratora</h1>
                <span class="item-sub" id="adminEmail"></span>
            </div>
            <div class="admin-actions">
                <a href="./" class="btn">Zobacz stronę</a>
                <button type="button" class="btn" id="logoutBtn">Wyloguj</button>
            </div>
        </div>

        <section class="card">
            <h2>Zgłoszenia od użytkowników (do akceptacji)</h2>
            <ul class="item-list" id="submissionsList">
                <li>Ładowanie zgłoszeń...</li>
            </ul>
            <div class="status-msg" id="modMsg"></div>
        </section>

        <div class="grid-2">
            <section class="card">
                <h2>Dodaj wykonawcę</h2>
                <form id="artistForm">
                    <div class="field">
                        <label for="artistName">Nazwa wykonawcy</label>
                        <input id="artistName" type="text" required placeholder="np. Sobel">
                    </div>
                    <button type="submit" class="btn btn-primary">Dodaj wykonawcę</button>
                </form>
                <div class="status-msg" id="artistMsg"></div>
            </section>

            <section class="card">
                <h2>Dodaj utwór bezpośrednio</h2>
                <form id="songForm">
                    <div class="field">
                        <label for="songArtist">Wykonawca</label>
                        <select id="songArtist" required>
                            <option value="">Ładowanie wykonawców...</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="songTitle">Tytuł utworu</label>
                        <input id="songTitle" type="text" required placeholder="np. Impreza">
                    </div>
                    <div class="field">
                        <label for="songSlug">Slug (adres URL)</label>
                        <input id="songSlug" type="text" required placeholder="np. sobel-impreza">
                    </div>
                    <div class="field">
                        <label for="songYoutubeUrl">Link do YouTube / YouTube Music (opcjonalnie)</label>
                        <input id="songYoutubeUrl" type="url" placeholder="https://music.youtube.com/watch?v=...">
                    </div>
                    <div class="field">
                        <label for="songLyrics">Tekst piosenki</label>
                        <textarea id="songLyrics" required placeholder="Wpisz tekst utworu..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Dodaj utwór</button>
                </form>
                <div class="status-msg" id="songMsg"></div>
            </section>
        </div>

        <div class="grid-2" style="margin-top: 32px;">
            <section class="card">
                <h2>Opublikowane utwory</h2>
                <ul class="item-list" id="adminSongsList">
                    <li>Ładowanie...</li>
                </ul>
            </section>

            <section class="card">
                <h2>Wykonawcy</h2>
                <ul class="item-list" id="adminArtistsList">
                    <li>Ładowanie...</li>
                </ul>
            </section>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://oxkstekhjumgbdjzxsdr.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_IU3Bb6fXNt6mZlJGx3JHjA_Ff_Otitd";

const root = document.documentElement;
const toggle = document.getElementById("themeToggle");
function applyTheme(t) {
    root.dataset.theme = t;
    if (toggle) toggle.setAttribute("aria-pressed", t === "dark");
}
applyTheme(root.dataset.theme || "light");
if (toggle) {
    toggle.addEventListener("click", () => {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        applyTheme(next);
        try { localStorage.setItem("lyrio-theme", next); } catch (e) {}
    });
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const guardMsg = document.getElementById("guardMsg");
const adminContent = document.getElementById("adminContent");
const adminEmail = document.getElementById("adminEmail");
const modMsg = document.getElementById("modMsg");

function escapeHtml(str) {
    return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function extractYouTubeId(rawUrl) {
    if (!rawUrl) return null;
    const trimmed = rawUrl.trim();
    if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;

    try {
        const url = new URL(trimmed);
        const host = url.hostname.replace(/^www\./, "");
        const allowedHosts = new Set([
            "youtube.com",
            "m.youtube.com",
            "music.youtube.com",
            "youtu.be",
            "youtube-nocookie.com"
        ]);
        if (!allowedHosts.has(host)) return null;

        if (host === "youtu.be") {
            const id = url.pathname.split("/").filter(Boolean)[0];
            return id && /^[a-zA-Z0-9_-]{11}$/.test(id) ? id : null;
        }

        const vParam = url.searchParams.get("v");
        if (vParam && /^[a-zA-Z0-9_-]{11}$/.test(vParam)) return vParam;

        const parts = url.pathname.split("/").filter(Boolean);
        const embedIdx = parts.findIndex(p => p === "embed" || p === "shorts" || p === "live");
        if (embedIdx !== -1 && parts[embedIdx + 1] && /^[a-zA-Z0-9_-]{11}$/.test(parts[embedIdx + 1])) {
            return parts[embedIdx + 1];
        }
    } catch (e) {
        return null;
    }
    return null;
}

function slugify(text) {
    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/ł/g, "l")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
}

function setStatus(el, text, isErr = false) {
    el.textContent = text;
    el.className = isErr ? "status-msg err" : "status-msg";
}

async function initAdmin() {
    const { data: sessionData, error: sessErr } = await sb.auth.getSession();
    const user = sessionData?.session?.user;

    if (sessErr || !user) {
        window.location.replace("./logowanie.html");
        return;
    }

    const { data: roleRows, error: roleErr } = await sb
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id)
        .limit(1);

    const roleRow = Array.isArray(roleRows) ? roleRows[0] : null;
    if (roleErr || !roleRow || roleRow.role !== "admin") {
        guardMsg.innerHTML = 'Brak uprawnień administratora. <a href="./" style="text-decoration:underline">Wróć na stronę główną</a>.';
        return;
    }

    guardMsg.style.display = "none";
    adminContent.style.display = "block";
    adminEmail.textContent = `Zalogowano jako: ${user.email}`;

    await Promise.all([loadSubmissions(), loadArtists(), loadSongs()]);
}

async function getOrCreateArtistId(artistName) {
    const cleanName = artistName.trim();
    const { data: existing, error: selErr } = await sb
        .from("artists")
        .select("id, name")
        .ilike("name", cleanName)
        .limit(1);

    if (selErr) throw selErr;
    if (Array.isArray(existing) && existing[0]?.id) {
        return existing[0].id;
    }

    const { data: inserted, error: insErr } = await sb
        .from("artists")
        .insert({ name: cleanName })
        .select("id")
        .single();

    if (insErr) throw insErr;
    return inserted.id;
}

async function loadSubmissions() {
    const list = document.getElementById("submissionsList");
    const { data, error } = await sb
        .from("song_submissions")
        .select("id, artist_name, title, slug, lyrics, youtube_url, submitted_by, submitter_name, created_at")
        .order("created_at", { ascending: false });

    if (error) {
        list.innerHTML = `<li>${escapeHtml(error.message)}</li>`;
        return;
    }

    if (!data || data.length === 0) {
        list.innerHTML = '<li>Brak nowych zgłoszeń do moderacji.</li>';
        return;
    }

    list.innerHTML = data.map(item => {
        const vid = extractYouTubeId(item.youtube_url);
        const embedHtml = vid
            ? `<div class="sub-iframe-wrap"><iframe src="https://www.youtube.com/embed/${escapeHtml(vid)}" title="Odtwarzacz YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`
            : `<span class="item-sub">Brak linku YouTube</span>`;

        return `
            <li>
                <div style="flex:1; min-width:0;">
                    <strong>${escapeHtml(item.title)}</strong>
                    <span class="item-sub">Wykonawca: ${escapeHtml(item.artist_name)} · slug: ${escapeHtml(item.slug)}</span>
                    ${embedHtml}
                    <div class="lyrics-preview">${escapeHtml(item.lyrics)}</div>
                </div>
                <div class="row-btns">
                    <button type="button" class="btn-ok" data-accept-id="${escapeHtml(item.id)}">Akceptuj</button>
                    <button type="button" class="btn-del" data-reject-id="${escapeHtml(item.id)}">Wyrzuć</button>
                </div>
            </li>
        `;
    }).join("");

    list.querySelectorAll("[data-accept-id]").forEach(btn => {
        btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-accept-id");
            const sub = data.find(x => String(x.id) === String(id));
            if (!sub) return;

            btn.disabled = true;
            setStatus(modMsg, "Akceptowanie i publikowanie utworu...");

            try {
                const artistId = await getOrCreateArtistId(sub.artist_name);
                const vid = extractYouTubeId(sub.youtube_url);
                const normalizedYt = vid ? `https://www.youtube.com/watch?v=${vid}` : null;

                const { error: songErr } = await sb.from("songs").insert({
                    artist_id: artistId,
                    title: sub.title,
                    slug: sub.slug,
                    lyrics: sub.lyrics,
                    youtube_url: normalizedYt
                });
                if (songErr) throw songErr;

                const { error: delErr } = await sb
                    .from("song_submissions")
                    .delete()
                    .eq("id", sub.id);
                if (delErr) throw delErr;

                setStatus(modMsg, `Opublikowano: ${sub.title} (${sub.artist_name}).`);
                await Promise.all([loadSubmissions(), loadArtists(), loadSongs()]);
            } catch (err) {
                btn.disabled = false;
                setStatus(modMsg, "Błąd akceptacji: " + err.message, true);
            }
        });
    });

    list.querySelectorAll("[data-reject-id]").forEach(btn => {
        btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-reject-id");
            btn.disabled = true;
            setStatus(modMsg, "Usuwanie zgłoszenia...");

            const { error: delErr } = await sb
                .from("song_submissions")
                .delete()
                .eq("id", id);

            if (delErr) {
                btn.disabled = false;
                setStatus(modMsg, "Błąd usuwania: " + delErr.message, true);
                return;
            }

            setStatus(modMsg, "Zgłoszenie zostało wyrzucone.");
            await loadSubmissions();
        });
    });
}

async function loadArtists() {
    const select = document.getElementById("songArtist");
    const list = document.getElementById("adminArtistsList");

    const { data, error } = await sb
        .from("artists")
        .select("id, name")
        .order("name", { ascending: true });

    if (error) {
        select.innerHTML = '<option value="">Błąd ładowania wykonawców</option>';
        list.innerHTML = `<li>${escapeHtml(error.message)}</li>`;
        return;
    }

    if (!data || data.length === 0) {
        select.innerHTML = '<option value="">Najpierw dodaj wykonawcę</option>';
        list.innerHTML = '<li>Brak wykonawców w bazie.</li>';
        return;
    }

    select.innerHTML = '<option value="">Wybierz wykonawcę...</option>' +
        data.map(a => `<option value="${escapeHtml(a.id)}">${escapeHtml(a.name)}</option>`).join("");

    list.innerHTML = data.map(a => `
        <li>
            <span>${escapeHtml(a.name)}</span>
            <button type="button" class="btn-del" data-del-artist="${escapeHtml(a.id)}">Usuń</button>
        </li>
    `).join("");

    list.querySelectorAll("[data-del-artist]").forEach(btn => {
        btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-del-artist");
            const { error: delErr } = await sb.from("artists").delete().eq("id", id);
            if (delErr) {
                alert("Nie udało się usunąć wykonawcy: " + delErr.message);
                return;
            }
            await Promise.all([loadArtists(), loadSongs()]);
        });
    });
}

async function loadSongs() {
    const list = document.getElementById("adminSongsList");
    const { data, error } = await sb
        .from("songs")
        .select("id, title, slug, youtube_url, artists(name)")
        .limit(20);

    if (error) {
        list.innerHTML = `<li>${escapeHtml(error.message)}</li>`;
        return;
    }

    if (!data || data.length === 0) {
        list.innerHTML = '<li>Brak opublikowanych utworów.</li>';
        return;
    }

    list.innerHTML = data.map(s => {
        const artistName = Array.isArray(s.artists) ? s.artists[0]?.name : s.artists?.name;
        const ytTag = extractYouTubeId(s.youtube_url) ? " · YT ✓" : "";
        return `
            <li>
                <div>
                    <strong>${escapeHtml(s.title)}</strong>
                    <span class="item-sub">${escapeHtml(artistName || "—")} · /${escapeHtml(s.slug || "")}${ytTag}</span>
                </div>
                <button type="button" class="btn-del" data-del-song="${escapeHtml(s.id)}">Usuń</button>
            </li>
        `;
    }).join("");

    list.querySelectorAll("[data-del-song]").forEach(btn => {
        btn.addEventListener("click", async () => {
            const id = btn.getAttribute("data-del-song");
            const { error: delErr } = await sb.from("songs").delete().eq("id", id);
            if (delErr) {
                alert("Nie udało się usunąć utworu: " + delErr.message);
                return;
            }
            await loadSongs();
        });
    });
}

document.getElementById("artistForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("artistMsg");
    const input = document.getElementById("artistName");
    const name = input.value.trim();
    if (!name) return;

    setStatus(msg, "Zapisywanie...");
    const { error } = await sb.from("artists").insert({ name });
    if (error) {
        setStatus(msg, "Błąd: " + error.message, true);
        return;
    }
    input.value = "";
    setStatus(msg, "Dodano wykonawcę.");
    await loadArtists();
});

const titleInput = document.getElementById("songTitle");
const slugInput = document.getElementById("songSlug");
let slugEditedManually = false;

slugInput.addEventListener("input", () => {
    slugEditedManually = slugInput.value.trim().length > 0;
});

titleInput.addEventListener("input", () => {
    if (!slugEditedManually) {
        slugInput.value = slugify(titleInput.value);
    }
});

document.getElementById("songForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("songMsg");

    const artist_id = document.getElementById("songArtist").value;
    const title = titleInput.value.trim();
    const slug = slugInput.value.trim() || slugify(title);
    const rawYt = document.getElementById("songYoutubeUrl").value.trim();
    const lyrics = document.getElementById("songLyrics").value;

    if (!artist_id || !title || !lyrics) return;

    let youtube_url = null;
    if (rawYt) {
        const vid = extractYouTubeId(rawYt);
        if (!vid) {
            setStatus(msg, "Niepoprawny link YouTube / YouTube Music.", true);
            return;
        }
        youtube_url = `https://www.youtube.com/watch?v=${vid}`;
    }

    setStatus(msg, "Dodawanie utworu...");
    const { error } = await sb.from("songs").insert({
        artist_id,
        title,
        slug,
        lyrics,
        youtube_url
    });

    if (error) {
        setStatus(msg, "Błąd: " + error.message, true);
        return;
    }

    e.target.reset();
    slugEditedManually = false;
    setStatus(msg, "Dodano utwór do bazy.");
    await loadSongs();
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
    await sb.auth.signOut();
    window.location.replace("./logowanie.html");
});

initAdmin();
</script>
</body>
</html>
